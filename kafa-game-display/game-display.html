<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KAFA Game — Platform Pembelajaran Interaktif</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🌙</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <style>
  /* ════════════════════════════════════════════
      RESET & VARIABLES
  ════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:            #06101f;
    --bg2:           #091626;
    --bg3:           #0c1e3a;
    --surface:       #0d1e38;
    --surface2:      #112240;
    --surface3:      #162d52;
    --border:        rgba(70,130,255,.10);
    --border2:       rgba(70,130,255,.20);
    --border3:       rgba(70,130,255,.36);
    --gold:          #c9963a;
    --gold2:         #e8b84b;
    --gold3:         #f5cc72;
    --gold-glow:     rgba(201,150,58,.30);
    --accent:        #3d7fff;
    --accent2:       #6fa3ff;
    --accent3:       #b0ccff;
    --accent-glow:   rgba(61,127,255,.20);
    --green:         #1ec97a;
    --green-bg:      rgba(30,201,122,.12);
    --red:           #ff4f4f;
    --red-bg:        rgba(255,79,79,.12);
    --yellow:        #f0b429;
    --txt:           #ddeeff;
    --txt2:          #7a9cc8;
    --txt3:          #3e5f88;
    --txt-inv:       #06101f;
    --radius-sm:     10px;
    --radius:        16px;
    --radius-lg:     22px;
    --radius-xl:     30px;
    --font-display:  'Cormorant Garamond', serif;
    --font-body:     'Plus Jakarta Sans', sans-serif;
    --font-game:     'Baloo 2', sans-serif;
    --header-h:      62px;
    --max-w:         700px;
    --shadow:        0 14px 50px rgba(0,0,0,.55);
    --shadow-sm:     0 4px 18px rgba(0,0,0,.40);
    --shadow-gold:   0 6px 30px var(--gold-glow);
    --shadow-accent: 0 6px 28px var(--accent-glow);
    --transition:    all .22s cubic-bezier(.4,0,.2,1);
  }

  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 95% 55% at 12% -8%,  rgba(61,127,255,.08)  0%, transparent 60%),
      radial-gradient(ellipse 75% 50% at 90% 105%, rgba(201,150,58,.07)  0%, transparent 60%),
      radial-gradient(ellipse 55% 40% at 55%  50%, rgba(14,32,62,.85)    0%, transparent 100%);
  }

  /* ════════════════════════════════════════════
      HEADER
  ════════════════════════════════════════════ */
  #mainHeader {
    position: sticky; top: 0; z-index: 100;
    height: var(--header-h);
    display: flex; align-items: center; gap: 10px;
    padding: 0 20px;
    background: rgba(6,16,31,.90);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border2);
  }

  #mainHeader::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--gold) 25%, var(--gold3) 50%, var(--accent2) 72%, transparent 100%);
    opacity: .65;
  }

  .header-logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; flex: 1; min-width: 0;
  }

  .logo-icon {
    width: 36px; height: 36px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--gold), var(--gold3));
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: var(--shadow-gold);
    position: relative;
  }

  .header-logo > span {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 700;
    color: var(--txt); letter-spacing: .07em; white-space: nowrap;
  }
  .header-logo em { font-style: italic; color: var(--gold2); margin-left: 5px; }

  .btn-keluar {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--txt2);
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all .2s; flex-shrink: 0;
  }
  .btn-keluar:hover { border-color: rgba(255,79,79,.5); color: var(--red); background: var(--red-bg); }

  /* ════════════════════════════════════════════
      MAIN SECTIONS CONTROLLER
  ════════════════════════════════════════════ */
  main { position: relative; z-index: 1; min-height: calc(100vh - var(--header-h)); }
  .app-section { display: none; width: 100%; animation: fadeUp .4s ease both; }
  .app-section.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ════════════════════════════════════════════
      LOGIN SCREEN (Nama Sahaja)
  ════════════════════════════════════════════ */
  #loginScreen {
    align-items: center; justify-content: center;
    min-height: calc(100vh - var(--header-h));
    padding: 24px 16px;
  }
  #loginScreen.active { display: flex; }

  .login-card {
    width: 100%; max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-xl);
    padding: 44px 32px 36px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
    position: relative; overflow: hidden;
  }

  .login-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold3), var(--accent2), transparent);
  }

  .login-logo { text-align: center; margin-bottom: 36px; }
  .big-icon { font-size: 58px; line-height: 1; margin-bottom: 14px; display: inline-block; filter: drop-shadow(0 6px 22px rgba(201,150,58,.5)); }

  .login-logo h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--txt); letter-spacing: .07em; margin-bottom: 6px; }
  .login-logo h1 span { color: var(--gold2); font-style: italic; }
  .login-logo p { font-size: 11.5px; color: var(--txt3); letter-spacing: .09em; text-transform: uppercase; font-weight: 500; }
  .login-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border2), transparent); margin: 0 0 26px; }

  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--txt2); letter-spacing: .10em; text-transform: uppercase; margin-bottom: 8px; }
  
  .form-group input[type="text"] {
    width: 100%; padding: 14px 16px; background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); color: var(--txt); font-family: var(--font-body); font-size: 14px;
    font-weight: 500; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .form-group input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

  .btn-masuk {
    width: 100%; margin-top: 10px; padding: 15px; background: linear-gradient(135deg, var(--gold) 0%, var(--gold3) 100%);
    border: none; border-radius: var(--radius-sm); color: var(--txt-inv); font-family: var(--font-body);
    font-size: 15px; font-weight: 800; letter-spacing: .04em; cursor: pointer; box-shadow: var(--shadow-gold); transition: transform .2s, box-shadow .2s;
  }
  .btn-masuk:hover { transform: translateY(-2px); box-shadow: 0 12px 38px var(--gold-glow); filter: brightness(1.06); }

  /* ════════════════════════════════════════════
      GAMEPLAY SCREEN
  ════════════════════════════════════════════ */
  #gameplayScreen { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  
  .game-header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; background: rgba(13,30,56,0.6); padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); }
  .game-title-area h3 { font-family: var(--font-game); font-size: 16px; color: var(--txt); }
  .game-title-area p { font-size: 11px; color: var(--txt2); }

  .stage-indicator { display: flex; gap: 6px; align-items: center; }
  .stage-dot {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-game); font-size: 12px; font-weight: 800; border: 1.5px solid var(--border2);
    background: var(--bg3); color: var(--txt3); transition: var(--transition);
  }
  .stage-dot.active { border-color: var(--accent); background: var(--accent-glow); color: var(--accent2); animation: pulseDot 1.6s infinite; }
  .stage-dot.done { border-color: var(--green); background: var(--green-bg); color: var(--green); }

  .score-bar { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px; margin-bottom: 14px; }
  .score-item { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .s-val { font-family: var(--font-game); font-size: 1.2rem; font-weight: 800; color: var(--gold3); }
  .s-label { font-size: 10px; color: var(--txt3); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .score-divider { width: 1px; height: 28px; background: var(--border2); }

  /* Timer & Progress Bar */
  .timer-wrap { margin-bottom: 16px; }
  .timer-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--txt2); margin-bottom: 6px; }
  .time-left { font-family: var(--font-game); font-size: 15px; color: var(--accent2); }
  .time-left.danger { color: var(--red); }
  .timer-bar-bg { height: 6px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .timer-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), var(--gold2)); transition: width 1s linear; }

  /* Question Box */
  .question-card { background: var(--surface2); border: 1px solid var(--border3); border-radius: var(--radius-lg); padding: 24px 20px; margin-bottom: 14px; position: relative; }
  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .q-badge { padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .q-badge.mcq { background: rgba(61,127,255,.15); color: var(--accent2); border: 1px solid rgba(61,127,255,.25); }
  .q-badge.match { background: rgba(201,150,58,.15); color: var(--gold2); border: 1px solid rgba(201,150,58,.25); }
  .q-badge.sort { background: rgba(30,201,122,.15); color: var(--green); border: 1px solid rgba(30,201,122,.25); }
  .q-text { font-family: var(--font-game); font-size: 1.15rem; font-weight: 700; line-height: 1.5; color: var(--txt); }

  /* MCQ Buttons Grid */
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width: 480px){ .options-grid { grid-template-columns: 1fr; } }
  .option-btn {
    padding: 15px; background: var(--bg2); border: 1.5px solid var(--border2); border-radius: var(--radius-sm);
    font-family: var(--font-game); font-size: 14px; font-weight: 700; color: var(--txt2); cursor: pointer;
    transition: var(--transition); text-align: center;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-glow); color: var(--txt); transform: translateY(-2px); }
  .option-btn.correct { border-color: var(--green) !important; background: var(--green-bg) !important; color: var(--green) !important; }
  .option-btn.wrong { border-color: var(--red) !important; background: var(--red-bg) !important; color: var(--red) !important; animation: shake 0.4s; }

  /* Matching Content CSS */
  .match-cols-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .match-col { display: flex; flex-direction: column; gap: 10px; }
  .match-item {
    padding: 14px; background: var(--bg2); border: 1.5px solid var(--border2); border-radius: var(--radius-sm);
    font-family: var(--font-game); font-size: 13px; font-weight: 700; text-align: center; color: var(--txt2); cursor: pointer; transition: var(--transition);
  }
  .match-item:hover { border-color: var(--accent2); }
  .match-item.selected { border-color: var(--gold); background: rgba(201,150,58,0.15); color: var(--gold2); }
  .match-item.matched-correct { border-color: var(--green) !important; background: var(--green-bg) !important; color: var(--green) !important; cursor: default; }
  .match-item.matched-wrong { border-color: var(--red) !important; background: var(--red-bg) !important; color: var(--red) !important; cursor: default; }

  /* Sort List CSS */
  .sort-list { display: flex; flex-direction: column; gap: 10px; }
  .sort-item {
    display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg2);
    border: 1.5px solid var(--border2); border-radius: var(--radius-sm); cursor: grab; transition: var(--transition);
  }
  .sort-item-num { width: 26px; height: 26px; background: var(--surface3); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-game); font-size: 12px; font-weight: 800; color: var(--accent2); }
  .sort-item-text { font-family: var(--font-game); font-size: 14px; color: var(--txt); flex: 1; }
  .sort-item.correct-pos { border-color: var(--green) !important; background: var(--green-bg) !important; }
  .sort-item.wrong-pos { border-color: var(--red) !important; background: var(--red-bg) !important; }
  .btn-semak { width: 100%; margin-top: 14px; padding: 14px; background: linear-gradient(135deg, var(--gold), var(--gold3)); border: none; border-radius: var(--radius-sm); font-family: var(--font-game); font-size: 15px; font-weight: 800; color: #06101f; cursor: pointer; box-shadow: var(--shadow-gold); }

  /* Results Card */
  .result-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 40px 24px; text-align: center; position: relative; }
  .result-emoji { font-size: 60px; margin-bottom: 12px; display: block; }
  .result-title { font-family: var(--font-game); font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
  .result-score { font-family: var(--font-game); font-size: 3.5rem; font-weight: 900; color: var(--gold2); }
  .result-score span { font-size: 1.2rem; color: var(--txt3); }
  .result-msg { font-size: 14px; color: var(--txt2); margin-bottom: 20px; }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ════════════════════════════════════════════
      RANKING / LEADERBOARD SCREEN
  ════════════════════════════════════════════ */
  #rankingSection { max-width: var(--max-w); margin: 0 auto; padding: 24px 16px 80px; }

  .section-header { text-align: center; margin-bottom: 28px; }
  .section-header h2 { font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: .05em; color: var(--txt); }
  .section-header h2 span { color: var(--gold2); font-style: italic; }
  .section-header p { font-size: 13px; color: var(--txt2); margin-top: 4px; }

  .ranking-table-wrap {
    background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-xl);
    box-shadow: var(--shadow); overflow: hidden; position: relative;
  }
  .ranking-table-wrap::before { content: ''; position: absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  .ranking-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
  .ranking-table th { background: rgba(6,16,31,.4); padding: 16px 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--txt3); border-bottom: 1px solid var(--border2); }
  .ranking-table td { padding: 16px 20px; border-bottom: 1px solid var(--border); color: var(--txt2); vertical-align: middle; }
  .ranking-table tr.saya { background: rgba(61,127,255,.07); }
  .ranking-table tr.saya td { border-bottom-color: rgba(61,127,255,.2); }

  .rank-num { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; font-family: var(--font-game); font-weight: 800; font-size: 12px; background: var(--bg3); color: var(--txt3); }
  .rank-1 { background: linear-gradient(135deg, var(--gold), #ffdd91) !important; color: var(--txt-inv) !important; box-shadow: 0 3px 12px var(--gold-glow); }
  .rank-2 { background: linear-gradient(135deg, #9caec4, #ddeeff) !important; color: var(--txt-inv) !important; }
  .rank-3 { background: linear-gradient(135deg, #a8733b, #e0aa75) !important; color: var(--txt-inv) !important; }
  
  .empty-state { text-align: center; padding: 48px 24px; color: var(--txt3); }
  .empty-state span { font-size: 48px; display: block; margin-bottom: 12px; opacity: .4; }
  </style>
</head>
<body>

  <header id="mainHeader">
    <a href="#" class="header-logo" onclick="showSection('rankingSection')">
      <div class="logo-icon">🌙</div>
      <span>GAME<em>KAFA</em></span>
    </a>
    <button id="logoutBtn" class="btn-keluar" style="display:none;" onclick="logout()">
      <span>Log Keluar</span>
    </button>
  </header>

  <main>
    
    <section id="loginScreen" class="app-section active">
      <div class="login-card">
        <div class="login-logo">
          <span class="big-icon">🕌</span>
          <h1>KAFA <span>SKSG</span></h1>
          <p>Display Mode</p>
        </div>
        <div class="login-divider"></div>
        <div class="form-group">
          <label for="usernameInput">Nama Penuh Murid</label>
          <input type="text" id="usernameInput" placeholder="Masukkan nama penuh anda..." autocomplete="off">
        </div>
        <button class="btn-masuk" onclick="login()">Mula Masuk & Main</button>
      </div>
    </section>

    <section id="gameplayScreen" class="app-section">
      <div id="gamePlayContainer"></div>
    </section>

    <section id="rankingSection" class="app-section">
      <div class="section-header">
        <h2>Carta <span>Kedudukan</span></h2>
        <p>Senarai markah tertinggi murid bagi Topik: Biodata Nabi Muhammad SAW</p>
      </div>
      <div id="leaderboardTableBox"></div>
    </section>

  </main>

  <script>
  // ── Database Soalan Biodata Nabi ──
  const CONFIG = {
    topikId: "biodata_nabi",
    topikTajuk: "Biodata Nabi Muhammad SAW",
    durasiMcq: 20, 
    soalan: [
      { id: 1, type: "mcq", stage: 1, question: "Di manakah tempat keputeraan Nabi Muhammad SAW?", options: ["Kota Makkah", "Kota Madinah", "Kota Taif", "Syam"], answer: "Kota Makkah" },
      { id: 2, type: "mcq", stage: 1, question: "Siapakah nama bapa Nabi Muhammad SAW?", options: ["Abu Talib", "Abdul Mutalib", "Abdullah", "Abu Lahab"], answer: "Abdullah" },
      { id: 3, type: "mcq", stage: 1, question: "Siapakah nama ibu susuan pertama Nabi Muhammad SAW selepas ibunya?", options: ["Halimatussa'diah", "Thuwaibah Al-Aslamiah", "Ummu Aiman", "Fatiman binti Asad"], answer: "Thuwaibah Al-Aslamiah" },
      { id: 4, type: "mcq", stage: 1, question: "Nabi Muhammad SAW dilahirkan pada malam Isnin, bersamaan...", options: ["12 Rabiulawal", "10 Rabiulawal", "1 Ramadhan", "27 Rajab"], answer: "12 Rabiulawal" },
      { id: 5, type: "mcq", stage: 1, question: "Apakah gelaran yang diberikan kepada Nabi Muhammad SAW kerana sifat amanah baginda?", options: ["Al-Amin", "As-Siddiq", "Al-Fatanah", "Al-Farooq"], answer: "Al-Amin" },
      {
        id: 6, type: "match", stage: 2, question: "Suaikan hubungan kekeluargaan Nabi Muhammad SAW dengan betul.",
        pairs: [
          { left: "Abdul Mutalib", right: "Datuk Baginda" },
          { left: "Aminah binti Wahab", right: "Ibu Kandung Baginda" },
          { left: "Abu Talib", right: "Bapa Saudara Baginda" },
          { left: "Halimatussa'diah", right: "Ibu Susuan di perkampungan Saad" }
        ]
      },
      {
        id: 7, type: "sort", stage: 3, question: "Susun kronologi penjagaan Nabi Muhammad SAW daripada kecil hingga dewasa mengikut urutan yang betul.",
        items: [
          { id: "s1", text: "Dipelihara oleh ibu kandung (Aminah) & ibu susuan" },
          { id: "s2", text: "Dijaga oleh datuk baginda, Abdul Mutalib selepas kematian ibu" },
          { id: "s3", text: "Diasuh oleh bapa saudara baginda, Abu Talib" },
          { id: "s4", text: "Keluar berniaga ke Syam bersama bapa saudara baginda" }
        ],
        correctOrder: ["s1", "s2", "s3", "s4"]
      }
    ]
  };

  let currentUser = null; 
  let gameEngine = {
    currentIndex: 0,
    score: 0,
    timer: null,
    timeLeft: 0,
    matchSelected: null,
    matchPairs: [],
    matchDoneCount: 0,
    sortItems: [],

    init() {
      this.currentIndex = 0;
      this.score = 0;
      this.renderQuestion();
    },

    renderQuestion() {
      clearInterval(this.timer);
      const container = document.getElementById('gamePlayContainer');
      if (this.currentIndex >= CONFIG.soalan.length) {
        this.tamatPermainan();
        return;
      }

      const q = CONFIG.soalan[this.currentIndex];
      
      let html = `
        <div class="game-header-bar">
          <div class="game-title-area">
            <h3>${CONFIG.topikTajuk}</h3>
            <p>Pemain: <b>${currentUser.nama}</b></p>
          </div>
          <div class="stage-indicator">
            <div class="stage-dot ${q.stage===1?'active':(q.stage>1?'done':'')}">1</div>
            <div class="stage-dot ${q.stage===2?'active':(q.stage>2?'done':'')}">2</div>
            <div class="stage-dot ${q.stage===3?'active':(q.stage>3?'done':'')}">3</div>
          </div>
        </div>
        
        <div class="score-bar">
          <div class="score-item"><span class="s-val">${this.currentIndex + 1} / ${CONFIG.soalan.length}</span><span class="s-label">Soalan</span></div>
          <div class="score-divider"></div>
          <div class="score-item"><span class="s-val" id="liveScore">${this.score}</span><span class="s-label">Markah</span></div>
        </div>
      `;

      if (q.type === "mcq") {
        html += this.buildMcq(q);
        container.innerHTML = html;
        this.startMcqTimer();
      } else if (q.type === "match") {
        html += this.buildMatch(q);
        container.innerHTML = html;
      } else if (q.type === "sort") {
        html += this.buildSort(q);
        container.innerHTML = html;
        this.setupSortEvents();
      }
    },

    buildMcq(q) {
      let options = [...q.options];
      options.sort(() => Math.random() - 0.5);

      let optsHtml = options.map((opt, i) => {
        let letter = String.fromCharCode(65 + i);
        return `<button class="option-btn" onclick="gameEngine.checkMcq(this, '${opt.replace(/'/g, "\\'")}')">
                  <span class="option-letter">${letter}</span> ${opt}
                </button>`;
      }).join('');

      return `
        <div class="timer-wrap">
          <div class="timer-label"><span>Masa Menjawab</span><span class="time-left" id="timerBox">${CONFIG.durasiMcq}s</span></div>
          <div class="timer-bar-bg"><div class="timer-bar-fill" id="timerBar"></div></div>
        </div>
        <div class="question-card">
          <div class="q-meta"><span class="q-badge mcq">Tahap 1: MCQ</span></div>
          <div class="q-text">${q.question}</div>
        </div>
        <div class="options-grid" id="mcqGrid">${optsHtml}</div>
      `;
    },

    startMcqTimer() {
      this.timeLeft = CONFIG.durasiMcq;
      const tBox = document.getElementById('timerBox');
      const tBar = document.getElementById('timerBar');
      
      this.timer = setInterval(() => {
        this.timeLeft--;
        if(tBox) tBox.innerText = this.timeLeft + "s";
        if(tBar) tBar.style.width = (this.timeLeft / CONFIG.durasiMcq * 100) + "%";
        
        if (this.timeLeft <= 5 && tBox) tBox.classList.add('danger');

        if (this.timeLeft <= 0) {
          clearInterval(this.timer);
          const btns = document.querySelectorAll('#mcqGrid button');
          btns.forEach(b => b.disabled = true);
          this.currentIndex++;
          setTimeout(() => this.renderQuestion(), 1500);
        }
      }, 1000);
    },

    checkMcq(btn, chosen) {
      clearInterval(this.timer);
      const q = CONFIG.soalan[this.currentIndex];
      const btns = document.querySelectorAll('#mcqGrid button');
      btns.forEach(b => b.disabled = true);

      if (chosen === q.answer) {
        btn.classList.add('correct');
        this.score += 10; 
        document.getElementById('liveScore').innerText = this.score;
      } else {
        btn.classList.add('wrong');
        btns.forEach(b => {
          if(b.innerText.includes(q.answer)) b.classList.add('correct');
        });
      }

      this.currentIndex++;
      setTimeout(() => this.renderQuestion(), 1500);
    },

    buildMatch(q) {
      this.matchSelected = null;
      this.matchDoneCount = 0;
      this.matchPairs = q.pairs;

      let lefts = q.pairs.map(p => p.left).sort(() => Math.random() - 0.5);
      let rights = q.pairs.map(p => p.right).sort(() => Math.random() - 0.5);

      let leftHtml = lefts.map((txt, i) => `<div class="match-item" id="left_${i}" data-type="left" data-val="${txt.replace(/"/g,'&quot;')}" onclick="gameEngine.clickMatch(this)">${txt}</div>`).join('');
      let rightHtml = rights.map((txt, i) => `<div class="match-item" id="right_${i}" data-type="right" data-val="${txt.replace(/"/g,'&quot;')}" onclick="gameEngine.clickMatch(this)">${txt}</div>`).join('');

      return `
        <div class="question-card">
          <div class="q-meta"><span class="q-badge match">Tahap 2: Suaian</span></div>
          <div class="q-text">${q.question}</div>
          <p style="font-size:12px;color:var(--txt2)">💡 Klik pada item kiri, kemudian klik pasangannya di sebelah kanan.</p>
        </div>
        <div class="match-cols-wrap">
          <div class="match-col">${leftHtml}</div>
          <div class="match-col">${rightHtml}</div>
        </div>
      `;
    },

    clickMatch(el) {
      if (el.classList.contains('matched-correct') || el.classList.contains('matched-wrong')) return;

      if (!this.matchSelected) {
        this.matchSelected = el;
        el.classList.add('selected');
      } else {
        let el1 = this.matchSelected;
        let el2 = el;

        if (el1.id === el2.id) {
          el1.classList.remove('selected');
          this.matchSelected = null;
          return;
        }

        if (el1.dataset.type === el2.dataset.type) {
          el1.classList.remove('selected');
          this.matchSelected = el;
          el.classList.add('selected');
          return;
        }

        let lVal = el1.dataset.type === 'left' ? el1.dataset.val : el2.dataset.val;
        let rVal = el1.dataset.type === 'right' ? el1.dataset.val : el2.dataset.val;

        let matchFound = this.matchPairs.find(p => p.left === lVal && p.right === rVal);

        if (matchFound) {
          el1.className = "match-item matched-correct";
          el2.className = "match-item matched-correct";
          this.score += 5; 
          document.getElementById('liveScore').innerText = this.score;
        } else {
          el1.className = "match-item matched-wrong";
          el2.className = "match-item matched-wrong";
          let itemA = el1, itemB = el2;
          setTimeout(() => {
            itemA.className = "match-item";
            itemB.className = "match-item";
          }, 1000);
        }

        this.matchSelected = null;
        this.matchDoneCount++;

        if (this.matchDoneCount >= this.matchPairs.length) {
          this.currentIndex++;
          setTimeout(() => this.renderQuestion(), 1800);
        }
      }
    },

    buildSort(q) {
      this.sortItems = [...q.items].sort(() => Math.random() - 0.5);

      let itemsHtml = this.sortItems.map((item, index) => {
        return `
          <div class="sort-item" draggable="true" data-id="${item.id}" data-index="${index}">
            <div class="sort-item-num">${index + 1}</div>
            <div class="sort-item-text">${item.text}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="question-card">
          <div class="q-meta"><span class="q-badge sort">Tahap 3: Susunan</span></div>
          <div class="q-text">${q.question}</div>
          <p style="font-size:12px;color:var(--txt2)">↕️ Heret dan susun baris mengikut kronologi dari atas ke bawah.</p>
        </div>
        <div class="sort-list" id="sortableList">${itemsHtml}</div>
        <button class="btn-semak" id="btnSemakSort" onclick="gameEngine.checkSort()">Semak & Hantar Jawapan</button>
      `;
    },

    setupSortEvents() {
      const list = document.getElementById('sortableList');
      if (!list) return;

      let draggedEl = null;

      list.addEventListener('dragstart', (e) => {
        draggedEl = e.target.closest('.sort-item');
        if (draggedEl) draggedEl.classList.add('dragging');
      });

      list.addEventListener('dragend', (e) => {
        if (draggedEl) draggedEl.classList.remove('dragging');
        const items = list.querySelectorAll('.sort-item');
        items.forEach((item, idx) => {
          item.querySelector('.sort-item-num').innerText = idx + 1;
        });
      });

      list.addEventListener('dragover', (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(list, e.clientY);
        if (afterElement == null) {
          list.appendChild(draggedEl);
        } else {
          list.insertBefore(draggedEl, afterElement);
        }
      });

      function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.sort-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
          } else {
            return closest;
          }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
      }
    },

    checkSort() {
      document.getElementById('btnSemakSort').disabled = true;
      const q = CONFIG.soalan[this.currentIndex];
      const items = document.querySelectorAll('#sortableList .sort-item');
      
      let userOrder = [];
      items.forEach(item => {
        userOrder.push(item.dataset.id);
      });

      userOrder.forEach((id, idx) => {
        if (id === q.correctOrder[idx]) {
          items[idx].classList.add('correct-pos');
          this.score += 1.25; 
        } else {
          items[idx].classList.add('wrong-pos');
        }
      });

      this.score = Math.round(this.score);
      document.getElementById('liveScore').innerText = this.score;

      this.currentIndex++;
      setTimeout(() => this.renderQuestion(), 2000);
    },

    tamatPermainan() {
      clearInterval(this.timer);
      const hariIni = new Date().toLocaleDateString('ms-MY', {day:'numeric', month:'short', year:'numeric'});
      let databaseRanking = JSON.parse(localStorage.getItem('kafa_ranking_records') || '[]');
      
      let rekodBaru = {
        nama: currentUser.nama,
        markah: this.score,
        tarikh: hariIni
      };

      databaseRanking.push(rekodBaru);
      localStorage.setItem('kafa_ranking_records', JSON.stringify(databaseRanking));

      renderLeaderboard();

      const container = document.getElementById('gamePlayContainer');
      container.innerHTML = `
        <div class="result-card">
          <span class="result-emoji">🏆</span>
          <div class="result-title">Syabas, Permainan Tamat!</div>
          <div class="result-score">${this.score} <span>/ 75 Markah Penuh</span></div>
          <p class="result-msg">Tahniah ${currentUser.nama}, markah anda berjaya disimpan.</p>
          <div style="color:var(--gold3);font-size:13px;font-weight:600;margin-top:10px;">⚡ Membuka Carta Kedudukan Ranking dalam 3 saat...</div>
        </div>
      `;

      setTimeout(() => {
        showSection('rankingSection');
      }, 3000);
    }
  };

  function showSection(id) {
    document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
    const target = document.getElementById(id);
    if(target) target.classList.add('active');
  }

  function login() {
    const inputNama = document.getElementById('usernameInput').value.trim();
    if (!inputNama) {
      alert('Sila masukkan nama penuh anda!');
      return;
    }
    currentUser = { nama: inputNama.toUpperCase() };
    document.getElementById('logoutBtn').style.display = 'flex';
    showSection('gameplayScreen');
    gameEngine.init();
  }

  function logout() {
    currentUser = null;
    document.getElementById('usernameInput').value = '';
    document.getElementById('logoutBtn').style.display = 'none';
    showSection('loginScreen');
  }

  function renderLeaderboard() {
    const container = document.getElementById('leaderboardTableBox');
    let records = JSON.parse(localStorage.getItem('kafa_ranking_records') || '[]');

    if (records.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <span>📊</span>
          <p>Belum ada rekod markah. Jom mula main!</p>
        </div>
      `;
      return;
    }

    records.sort((a, b) => b.markah - a.markah);

    let rows = records.map((d, index) => {
      let rank = index + 1;
      let rankClass = '';
      let medal = '';

      if (rank === 1) { rankClass = 'rank-1'; medal = '🥇'; }
      else if (rank === 2) { rankClass = 'rank-2'; medal = '🥈'; }
      else if (rank === 3) { rankClass = 'rank-3'; medal = '🥉'; }

      let isSaya = currentUser && d.nama === currentUser.nama;

      return `
        <tr class="${isSaya ? 'saya' : ''}">
          <td><span class="rank-num ${rankClass}">${rank}</span> ${medal}</td>
          <td style="font-weight: ${isSaya ? '800' : '500'}">
            ${d.nama} ${isSaya ? ' <span style="font-size:10px;color:var(--accent2)">(Anda)</span>' : ''}
          </td>
          <td style="font-weight:800;color:var(--gold3)">${d.markah} <span style="color:var(--txt3);font-size:11px;font-weight:500">/ 75</span></td>
          <td style="font-size:12px;color:var(--txt3);">${d.tarikh || '-'}</td>
        </tr>
      `;
    }).join('');

    container.innerHTML = `
      <div class="ranking-table-wrap">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>Kedudukan</th>
              <th>Nama Murid</th>
              <th>Markah</th>
              <th>Tarikh Amali</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      </div>
    `;
  }

  window.onload = function() {
    renderLeaderboard();
  };
  </script>
</body>
</html>
