<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard & Papan Markah | Game KAFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #06101f;
      --bg2: #091626;
      --surface: #0d1e38;
      --surface2: #112240;
      --border: rgba(70,130,255,.15);
      --gold: #c9963a;
      --gold2: #e8b84b;
      --accent: #3d7fff;
      --txt: #ddeeff;
      --txt2: #7a9cc8;
      --radius: 12px;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-game: 'Baloo 2', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-family: var(--font-game);
      color: var(--gold2);
      font-size: 2rem;
      margin-bottom: 5px;
    }

    header p {
      color: var(--txt2);
      font-size: 0.95rem;
    }

    /* Form Daftar Mula Game */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .card-title {
      font-family: var(--font-game);
      font-size: 1.25rem;
      color: var(--txt);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--txt2);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-mula {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), #5b9fff);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-family: var(--font-game);
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .btn-mula:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* Papan Markah / Ranking Table */
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .ranking-table th {
      background: var(--surface2);
      color: var(--txt2);
      text-align: left;
      padding: 10px;
      font-weight: 700;
      border-bottom: 2px solid var(--border);
    }

    .ranking-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      color: var(--txt);
    }

    .ranking-table tr:hover {
      background: rgba(61,127,255,0.05);
    }

    .rank-badge {
      display: inline-block;
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      border-radius: 50%;
      font-weight: 800;
      font-size: 0.8rem;
    }
    .rank-1 { background: var(--gold); color: #000; }
    .rank-2 { background: #b0b0b0; color: #000; }
    .rank-3 { background: #cd7f32; color: #000; }

    .score-val {
      font-family: var(--font-game);
      font-weight: 800;
      color: var(--gold2);
    }

    .no-data {
      text-align: center;
      color: var(--txt3);
      padding: 20px;
      font-style: italic;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(255, 79, 79, 0.3);
      color: #ff4f4f;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      float: right;
      margin-top: -5px;
    }
    .btn-reset:hover {
      background: rgba(255, 79, 79, 0.1);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🌙 Game KAFA Digital</h1>
    <p>Uji kefahaman Sirah & Biodata Nabi Muhammad SAW ﷺ</p>
  </header>

  <div class="card">
    <div class="card-title">📝 Daftar Maklumat Pelajar</div>
    <form id="loginForm" onsubmit="mulaPermainan(event)">
      <div class="form-group">
        <label for="nama">Nama Penuh:</label>
        <input type="text" id="nama" class="form-control" required placeholder="Contoh: AHMAD BIN ALI">
      </div>
      <div class="form-group">
        <label for="kelas">Kelas:</label>
        <input type="text" id="kelas" class="form-control" required placeholder="Contoh: 3 AL-GHAZALI">
      </div>
      <button type="submit" class="btn-mula">🚀 Main Sekarang</button>
    </form>
  </div>

  <div class="card">
    <div class="card-title">
      🏆 Kedudukan Papan Markah
      <button class="btn-reset" onclick="padamMarkah()">Padam Data</button>
    </div>
    
    <table class="ranking-table" id="rankingTable" style="display: none;">
      <thead>
        <tr>
          <th style="width: 10%;">No</th>
          <th style="width: 50%;">Nama &amp; Kelas</th>
          <th style="width: 20%;">Tarikh</th>
          <th style="width: 20%;">Markah</th>
        </tr>
      </thead>
      <tbody id="rankingBody">
        </tbody>
    </table>
    
    <div id="noDataMsg" class="no-data">Belum ada rekod markah. Sila main kuiz dahulu!</div>
  </div>
</div>

<script>
  const TOPIK_ID = 'sirah-biodata-nabi'; // Mesti sama dengan topikId di fail biodata-nabi.html

  document.addEventListener('DOMContentLoaded', () => {
    paparRanking();
    
    // Auto-isi nama jika pelajar ingin main semula
    const params = new URLSearchParams(window.location.search);
    if (params.get('nama')) document.getElementById('nama').value = params.get('nama');
    if (params.get('kelas')) document.getElementById('kelas').value = params.get('kelas');
  });

  // Fungsi apabila butang 'Main Sekarang' ditekan
  function mulaPermainan(e) {
    e.preventDefault();
    const nama = document.getElementById('nama').value.trim().toUpperCase();
    const kelas = document.getElementById('kelas').value.trim().toUpperCase();

    // Sediakan parameter URL untuk dihantar ke game
    const params = new URLSearchParams({
      nama: nama,
      kelas: kelas,
      topikId: TOPIK_ID,
      topikNama: 'Biodata Nabi Muhammad SAW',
      subjek: 'Sirah'
    });

    // Buka game (Pastikan fail 'biodata-nabi.html' berada dalam folder/laluan yang betul)
    // Berdasarkan kod game anda, ia mencari index di "../../index.html", bermakna game berada di dalam subfolder.
    // Sesuaikan laluan (path) di bawah jika perlu:
    window.location.href = 'biodata-nabi.html?' + params.toString();
  }

  // Fungsi memaparkan rekod dari localStorage
  function paparRanking() {
    const table = document.getElementById('rankingTable');
    const body = document.getElementById('rankingBody');
    const noData = document.getElementById('noDataMsg');
    
    // Ambil data berdasarkan key localstorage yang digunakan oleh game anda
    const localDataKey = 'kafa_ranking_' + TOPIK_ID;
    const dataData = JSON.parse(localStorage.getItem(localDataKey) || '[]');

    // Susun markah tertinggi di atas sekali
    dataData.sort((a, b) => b.markah - a.markah);

    if (dataData.length === 0) {
      table.style.display = 'none';
      noData.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    noData.style.display = 'none';
    body.innerHTML = '';

    dataData.forEach((item, index) => {
      const row = document.createElement('tr');
      
      // Penghias nombor ranking 1, 2, 3
      let rankDisplay = index + 1;
      if(index < 3) {
        rankDisplay = `<span class="rank-badge rank-${index+1}">${index+1}</span>`;
      }

      row.innerHTML = `
        <td style="text-align: center;">${rankDisplay}</td>
        <td>
          <strong>${formatNama(item.nama)}</strong><br>
          <span style="font-size: 0.8rem; color: var(--txt2);">${item.kelas}</span>
        </td>
        <td style="font-size: 0.8rem; color: var(--txt2);">${item.masa || '-'}</td>
        <td><span class="score-val">${item.markah}</span> <span style="font-size:0.75rem; color:var(--txt2)">/ 75</span></td>
      `;
      body.appendChild(row);
    });
  }

  // Mematikan data jika guru/pelajar ingin reset papan markah
  function padamMarkah() {
    if (confirm('Adakah anda pasti mahu memadam semua rekod markah dan cubaan dalam komputer/peranti ini?')) {
      localStorage.removeItem('kafa_ranking_' + TOPIK_ID);
      
      // Padam juga data cubaan (attempts) supaya boleh main balik
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('kafa_attempts_') || key.startsWith('kafa_lock_')) {
          localStorage.removeItem(key);
          i--; 
        }
      }
      paparRanking();
      alert('Data berjaya dipadam!');
    }
  }

  // Format tulisan nama (Ahmad Bin Ali)
  function formatNama(str) {
    return str.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  }
</script>

</body>
</html>
